<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027 Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f3f3; --paper:#ffffff; --ink:#1a1a1a; --muted:#8a8a8a; --line:#e2e2e2; --line2:#eeeeee; --sel:rgba(0,0,0,.075);
  --accent:#1a1a1a; --accent-soft:#ececec; --sat:#2f6fd0; --sun:#d93a3a; --r:14px;
  --sans:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; --serif:var(--sans);
}
@media (prefers-color-scheme:dark){
  :root{--sel:rgba(255,255,255,.1);--bg:#141414;--paper:#1e1e1e;--ink:#ededed;--muted:#8f8f8f;--line:#333;--line2:#2a2a2a;--accent:#ededed;--accent-soft:#2c2c2c;--sat:#6fa3f0;--sun:#f07272}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0;cursor:pointer}

/* nav */
.nav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1640px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:10px 40px}
.brand{font-weight:900;font-size:18px;margin-right:14px;letter-spacing:-.3px}
.tab{padding:6px 14px;border-radius:999px;color:var(--muted);font-weight:500;font-size:14px}
.tab.home{display:inline-flex;align-items:center;padding:6px 10px}
.tab:hover{color:var(--ink);background:var(--line2)}
.tab.on{background:var(--ink);color:var(--paper)}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ink)}.sync.busy i{background:transparent;border:1px solid var(--ink)}.sync.err i{background:var(--muted)}

main{max-width:1640px;margin:0 auto;padding:28px 40px 80px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card+.card,.section,.mlayout+.card{margin-top:22px}
h2.sec{font-weight:700;font-size:20px;letter-spacing:-.3px;margin:0 0 14px;display:flex;align-items:baseline;gap:10px}
h2.sec small{font-weight:400;font-size:13px;color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.muted{color:var(--muted)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:10px;padding:9px 16px;font-weight:500}
.btn:hover{opacity:.88}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.field{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;outline:none;min-width:0}
.field:focus{border-color:var(--ink)}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px;opacity:.5}
.x:hover{opacity:1;background:var(--line2);color:var(--ink)}
.bare{border:0;background:transparent;outline:none;width:100%;padding:2px 0}
.bare:focus{background:var(--line2);border-radius:4px}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.empty.soft{color:var(--muted);opacity:.65;font-size:13px;padding:4px 0 8px}
a.empty.soft{text-decoration:none}

/* home */
.hero{text-align:center;padding:40px 0 30px}
.hero .big{font-weight:900;font-size:clamp(84px,16vw,168px);line-height:.9;letter-spacing:-6px}
.hero p{color:var(--muted);margin:14px 0 0}
.today{display:inline-block;margin-top:16px;padding:5px 14px;border:1px solid var(--line);border-radius:999px;font-size:13px}
.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:26px}
.sc{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px 24px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s;min-height:190px}
.sc:hover{transform:translateY(-3px);border-color:var(--ink)}
.sc .t{font-weight:700;font-size:38px;line-height:1;letter-spacing:-1px}
.sc .d{color:var(--muted);font-size:14px}
.sc .go{margin-top:auto;font-weight:500;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.note{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}

/* year */
.goal-form{display:flex;gap:8px;flex-wrap:wrap}
.goal-form .field[type=text]{flex:1 1 260px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 10px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 13px;font-size:13px;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tag{background:var(--line2);color:var(--ink);display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.gt-wrap{overflow-x:auto;margin:0 -6px;padding:0 6px}
table.gt{width:100%;border-collapse:collapse;min-width:820px}
.gt th{font-size:11px;font-weight:500;color:var(--muted);padding:8px 4px;border-bottom:1px solid var(--line);text-align:center}
.gt th.l{text-align:left}
.gt td{padding:8px 4px;border-bottom:1px solid var(--line2);text-align:center;vertical-align:middle}
.gt td.l{text-align:left}
.gt td.m{width:34px;padding-left:0;padding-right:0}
.mc{display:block;height:22px;margin:0 1px;border-radius:4px;background:var(--line2);cursor:pointer;touch-action:none;user-select:none;transition:background .1s}
.mc:hover{background:var(--line)}
.gt td.gr,.gt th.gr{width:130px;min-width:130px;padding-left:16px;padding-right:12px;text-align:left;border-left:1px solid var(--line2)}
.gt td.gr b{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.gt td.gr small{font-size:11px;color:var(--muted);margin-left:5px;font-variant-numeric:tabular-nums}
.rbar{display:block;height:4px;background:var(--line2);border-radius:999px;margin:4px 0 0;overflow:hidden}
.rbar i{display:block;height:100%;background:#6e6e6e;border-radius:999px}
.mc.on{background:#6e6e6e}
.mc.on:hover{background:#5a5a5a}
.mc:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.gt td.all{border-right:1px solid var(--line2);width:46px}
.handle{cursor:grab;touch-action:none;color:var(--muted);user-select:none;width:28px;font-size:16px;letter-spacing:-2px}
.handle:active{cursor:grabbing}
tr.dragging{background:var(--accent-soft)}
tr.dragging td{border-color:transparent}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mbox{position:relative;display:block;border:1px solid var(--line);border-radius:12px;padding:14px 14px 30px;min-height:120px;background:var(--bg);transition:border-color .15s,transform .15s,background .15s}
.mbox:hover{border-color:var(--ink);background:var(--paper);transform:translateY(-2px)}
.mbox .mgo{position:absolute;right:12px;bottom:8px;font-size:14px;color:var(--muted)}
.mbox:hover .mgo{color:var(--ink)}
.ylist{margin-bottom:6px}
.ylist .yg{flex:1;min-width:0;font-size:14px}
.mbox h4{margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.mbox h4 b{font-weight:700;font-size:17px;letter-spacing:.5px}
.mbox h4 span{font-size:12px;color:var(--muted)}
.mbox ul{list-style:none;margin:0;padding:0 4px 0 0;font-size:13px;max-height:calc(7 * 22px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.mbox li{line-height:18px}
.mbox li{display:flex;gap:7px;align-items:baseline;padding:2px 0}
.mbox li .dot{transform:translateY(-1px)}
.mbtns{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.mbtn{font-weight:500;font-size:20px;text-align:center;padding:16px 0;border:1px solid var(--line);border-radius:12px;background:var(--paper);letter-spacing:1px}
.mbtn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* page head */
.phead{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.phead .ttl{flex:1;min-width:0}
.trow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.arrows{display:inline-flex;gap:6px;margin-top:6px}
.trow h1.hm{min-width:1.3em;text-align:center;margin-left:.06em;font-size:clamp(64px,8vw,96px);font-weight:900;letter-spacing:-.06em;line-height:.82;font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}.trow h1.hw{min-width:4.8em}.trow h1.hd{min-width:5.7em}
.trow{flex-wrap:nowrap}
.phead h1{font-weight:700;letter-spacing:-1.5px;font-size:clamp(36px,6vw,56px);line-height:1;margin:4px 0 0}
.phead h1 span{font-family:var(--sans);font-size:18px;color:var(--muted);margin-left:8px;font-weight:400}
.arrow{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:20px;background:var(--paper)}
.arrow:hover{border-color:var(--ink)}
.arrow.off{opacity:.25;pointer-events:none}
.sub{font-size:14px;color:var(--muted);margin-top:6px}
.sub a{color:var(--ink);font-weight:500;margin-left:10px;text-decoration:underline;text-underline-offset:3px}

/* monthly */
.mlayout{display:grid;grid-template-columns:270px 1fr;gap:20px;align-items:start}
.side .card{padding:18px}
.side>.card+.card{margin-top:14px}
.mshell{display:block}
.mtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-6px 0 22px}
.mtabs a{padding:10px 16px;font-size:15px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.mtabs a:hover{color:var(--ink)}
.mtabs a.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
.mcontent{min-width:0}
.mcontent .mlayout{grid-template-columns:minmax(340px,30%) minmax(0,1fr)}
.mcontent .mlayout .mmemo{min-height:260px}
.mmain{min-width:0}
.mmain>.card:first-child{margin-top:0}
.wmemos.big{grid-template-columns:repeat(var(--wn),minmax(220px,1fr));gap:12px}
.wplanwrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.wscroll{overflow-x:auto;padding-bottom:4px}
.gpanel{position:fixed;left:24px;top:80px;width:290px;margin-top:0;padding:18px;max-height:calc(100vh - 104px);overflow-y:auto;z-index:35;box-shadow:0 12px 36px rgba(0,0,0,.14);transform:translateX(calc(-100% - 40px));opacity:0;visibility:hidden;transition:transform .22s ease,opacity .18s,visibility 0s linear .22s}
.gpanel.open{transform:translateX(0);opacity:1;visibility:visible;transition:transform .22s ease,opacity .18s}
.gpclose{margin-left:8px;font-size:18px}
.mtabs .gtoggle{margin-left:auto;align-self:center;font-size:13px;padding:5px 14px}
.mtabs .gtoggle.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.gpanel h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center}
.gp-cat{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 4px}
.gp-item{display:flex;align-items:center;gap:8px;padding:7px 8px;margin:0 -8px;border-radius:8px;cursor:grab;font-size:14px;user-select:none;touch-action:none}
.gp-item:hover{background:var(--line2)}
.gp-item input{flex:none;width:16px;height:16px;cursor:pointer}
.gp-item .gp-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gp-item.done .gp-t{text-decoration:line-through;color:var(--muted)}
.gp-item .gp-p{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:999px;padding:0 6px}
.gp-item.dragsrc{opacity:.4}
.gpanel .gadd{margin-top:14px}
.rte .h{font-weight:700;position:relative;padding-left:16px;margin-top:6px}
.rte .h::before{content:'';position:absolute;left:3px;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.rte .h[data-n]::before{content:'▾';width:auto;height:auto;background:none;top:0;left:0;font-size:12px;color:var(--muted);cursor:pointer;line-height:1.65}
.rte .h[data-n][data-col="1"]::before{content:'▸'}
.rte .h[data-col="1"]::after{content:attr(data-n);font-size:10px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 5px;margin-left:6px;vertical-align:1px}
.rte .cat{display:table;font-size:12px;font-weight:600;background:var(--line2);border-radius:6px;padding:1px 9px;margin:10px 0 2px}
.rte>div:first-child.cat,.rte>div:first-child.h{margin-top:0}
.rte [data-ind="1"]{margin-left:18px}
.rte [data-ind="2"]{margin-left:36px}
.rte [data-ind="3"]{margin-left:54px}
.rte .bul{position:relative;padding-left:16px}
.rte .bul::before{content:'';position:absolute;left:4px;top:.68em;width:5px;height:5px;border-radius:50%;background:var(--ink)}
.rte .bul[data-ind="1"]::before,.rte .bul[data-ind="3"]::before{background:transparent;border:1.2px solid var(--ink);width:4px;height:4px}
.rte .hid{display:none}
.rte>div.bsel{background:var(--sel)!important;box-shadow:-4px 0 0 var(--sel),4px 0 0 var(--sel)}
.rte>div.cat.bsel{outline:1.5px solid rgba(0,0,0,.3);outline-offset:1px}
body.bsel-drag,body.bsel-drag *{user-select:none!important;-webkit-user-select:none!important}
#bselbar{position:fixed;z-index:45;display:none;align-items:center;gap:1px;background:var(--paper);border:1px solid var(--line);border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.08);padding:3px;font-size:12px}
#bselbar.show{display:flex}
#bselbar .bscount{color:var(--muted);padding:0 8px 0 7px;font-weight:600;white-space:nowrap}
#bselbar button{font:inherit;color:var(--ink);background:none;border:0;padding:5px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
#bselbar button:hover{background:var(--line2)}
#bselbar .bsmenu{position:absolute;top:calc(100% + 4px);background:var(--paper);border:1px solid var(--line);border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.1);padding:4px;display:flex;flex-direction:column;min-width:170px}
#bselbar .bsmenu button{text-align:left}
#catmenu{position:fixed;z-index:60;display:none;flex-direction:column;min-width:150px;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.1);padding:4px}
#catmenu.show{display:flex}
#catmenu button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:7px;font-size:13px;display:flex;align-items:center;gap:8px;white-space:nowrap}
#catmenu button:hover{background:var(--line2)}
.rte-bar button{font-size:12px}
.gtrow{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;align-items:start}
.gtrow .list{max-height:180px;overflow-y:auto}
.side.gtrow>.card+.card{margin-top:0}
.wmemos.big .wm{background:var(--paper);padding:16px}
.wmemos.big .wm .rte{min-height:320px;font-size:14px}
.side h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between}
.list{list-style:none;margin:0 0 10px;padding:0}
.list li{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line2)}
.list li .bullet{color:var(--ink);font-size:10px;flex:none;width:16px;text-align:center}
.list li.done .bare{text-decoration:line-through;color:var(--muted)}
.addrow{display:flex;gap:6px}
.addrow .field{flex:1;padding:7px 10px;font-size:14px}
.cal{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal-h,.cal-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-h div{font-size:11px;letter-spacing:1.5px;color:var(--muted);text-align:center;padding:9px 0;border-bottom:1px solid var(--line)}
.cal-h .sa{color:var(--sat)}.cal-h .su{color:var(--sun)}
.cell{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);min-height:118px;padding:6px 7px;display:flex;flex-direction:column;min-width:0}
.cell:nth-child(7n){border-right:0}
.cal-row:last-child .cell{border-bottom:0}
.cell .n{font-size:13px;font-weight:500}
.cell.sa .n{color:var(--sat)}.cell.su .n,.cell.hol .n{color:var(--sun)}
.cell .ch{display:flex;align-items:baseline;gap:6px;min-width:0}
.cell .hn{font-size:11px;color:var(--sun);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cell.out .hn{opacity:.4}
.cell.out{background:var(--bg)}
.cell.out .n{opacity:.35}
.cell.today .n{background:var(--ink);color:var(--paper)!important;border-radius:999px;padding:0 7px;align-self:flex-start}
.cell textarea{flex:1;border:0;background:transparent;resize:none;outline:none;font-size:12px;line-height:1.45;padding:3px 0 0;min-height:80px;width:100%}
.cell textarea:focus{background:var(--line2);border-radius:6px}
.wmemos{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.wm{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px;display:flex;flex-direction:column;gap:6px}
.wm .h{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.wm .h b{font-size:14px}
.wm .h a{color:var(--ink);font-size:12px;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.wm .rte{min-height:120px;font-size:13px;padding:4px 6px;margin:0 -6px;border-radius:6px}
.wm .rte:focus{background:var(--paper)}
.rte{outline:none;line-height:1.65;word-break:break-word;cursor:text}
.rte>div{min-height:1.65em}
.rte b{font-weight:700}
.rte .todo{position:relative;padding-left:22px}
.rte .todo::before{content:'';position:absolute;left:1px;top:.32em;width:14px;height:14px;border:1.5px solid var(--ink);border-radius:3px;box-sizing:border-box;background:var(--paper);cursor:pointer}
.rte .todo[data-done="1"]::before{background:var(--ink)}
.rte .todo[data-done="1"]::after{content:'';position:absolute;left:6px;top:calc(.32em + 2px);width:4px;height:7px;border:solid var(--paper);border-width:0 2px 2px 0;transform:rotate(45deg);pointer-events:none}
.rte .todo[data-done="1"]{color:var(--muted);text-decoration:line-through}
.rte-bar{display:flex;gap:4px}
.rte-bar button{border:1px solid var(--line);background:var(--paper);border-radius:6px;width:28px;height:26px;font-size:13px;padding:0;display:grid;place-items:center;color:var(--ink)}
.rte-bar button:hover{border-color:var(--ink)}
.cbx{width:12px;height:12px;border:1.5px solid currentColor;border-radius:3px;display:block}

/* weekly */
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.wgrid>.card.spend{margin-top:0;align-self:stretch;display:flex;flex-direction:column}
.wplan{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.wgoals ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:14px}
.wgoals li{display:flex;align-items:center;gap:9px}
.wgoals .sec{justify-content:space-between}
.wgoals .more{font-size:15px;color:var(--muted);font-weight:400}
.wgoals .more:hover{color:var(--ink)}
.wstats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin-bottom:22px}
.wstat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:4px}
.wstat span{font-size:13px;color:var(--muted)}
.wstat b{font-size:26px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.wstat small{font-size:12px;color:var(--muted)}
.wstats+.wlog{margin-top:0}
.wgrid>.card.spend>.empty{flex:1;display:flex;align-items:center;justify-content:center;font-size:15px}
.card.wsec{margin-top:22px}
.sched{display:flex;flex-direction:column}
.sched .pin{flex:1;display:flex;flex-direction:column}
.wgrid+.card{margin-top:22px}
.wgrid>.card{margin-top:0}
.sched .empty{padding:0}

<main id="app"></main>

<script>
(function(){
const YEAR = 2027;
const PAL = [{bg:'#fbe0de',dot:'#ec8f87'},{bg:'#dbeeff',dot:'#7db4e6'},{bg:'#fff2bf',dot:'#e9c645'},{bg:'#e2f4d2',dot:'#8fca66'},{bg:'',dot:'#b8b8b8'},{bg:'#ece3fb',dot:'#a98be0'},{bg:'#ffe6d1',dot:'#f0a56b'},{bg:'#d7f3ec',dot:'#5fc2a8'},{bg:'#fde0ef',dot:'#e88bb8'}];
const DEFAULT_GCATS = [{n:'커리어',e:'💼',c:0},{n:'건강',e:'🏃🏻‍♀️‍➡️',c:1},{n:'공부',e:'✍🏻',c:2},{n:'경제',e:'💵',c:3},{n:'기타',e:'',c:4}];
const gcats = () => get('settings').goalCats;
const catInfo = n => gcats().find(x=>x.n===n) || {n, e:'', c:4};
const catLabel = n => { const i = catInfo(n); return (i.e||'') + n; };
const catDot = n => PAL[catInfo(n).c % PAL.length].dot;
let gEdit = false;
let renaming = null;
const isRen = (k,i) => renaming && renaming.kind===k && renaming.i===i;
const renInput = (k,i,v) => `<span class="mchip editing"><input class="ren" type="text" value="${esc(v)}" data-ren="1" data-kind="${k}" data-i="${i}" aria-label="이름 수정" autocomplete="off"></span>`;
async function renameInDays(field, oldV, newV){
  const keys = new Set(Object.keys(cache).filter(k=>k[0]==='d'));
  try { for (let i=0;i<localStorage.length;i++){ const k = localStorage.key(i); if (k && k.startsWith(LS+'d')) keys.add(k.slice(LS.length)); } } catch(e){}
  if (db && me){
    try {
      const qs = await db.collection('data/users/'+me).get();
      qs.docs.forEach(doc=>{ if (doc.id[0]!=='d' || !doc.exists) return; keys.add(doc.id);
        if (!cache[doc.id] || (remoteState[doc.id]!=='done' && !remoteState[doc.id+':edited'])){ cache[doc.id] = Object.assign(defaults(doc.id), JSON.parse(JSON.stringify(doc.data()))); remoteState[doc.id] = 'done'; } });
    } catch(e){}
  }
  keys.forEach(k=>{ const d = get(k); let ch = false; (d.exps||[]).forEach(e=>{ if (e[field]===oldV){ e[field]=newV; ch=true; } }); if (ch) save(k); });
}
function commitRen(inp, cancel){
  if (inp.dataset.done) return; inp.dataset.done = '1';
  const kind = inp.dataset.kind, i = +inp.dataset.i, v = inp.value.trim();
  renaming = null;
  if (cancel || !v){ render(); return; }
  const st = get('settings');
  if (kind==='goalCats'){
    const x = st.goalCats[i]; if (!x){ render(); return; }
    const old = x.n;
    if (v !== (x.e||'')+x.n && !st.goalCats.some((y,j)=> j!==i && (y.n===v || (y.e||'')+y.n===v))){
      x.n = v; x.e = '';
      get('year').goals.forEach(g=>{ if (g.cat===old) g.cat = v; });
      if (yearFilter===old) yearFilter = v;
      save('year'); save('settings');
    }
  } else {
    const list = st[kind], old = list[i];
    if (old!=null && v!==old && !list.includes(v)){
      list[i] = v; save('settings');
      if (kind==='expCats' && eCat===old) eCat = v;
      if (kind==='payMethods' && ePay===old) ePay = v;
      renameInDays(kind==='expCats' ? 'cat' : 'pay', old, v).then(()=>{ if (cur.view==='day') safeRender(); });
    }
  }
  render();
}
const GEAR = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`;
// 2027 관공서 공휴일 (우주항공청 2027년 월력요항 기준)
const HOLIDAYS = {'2027-01-01':'신정','2027-02-06':'설날 연휴','2027-02-07':'설날','2027-02-08':'설날 연휴','2027-02-09':'대체공휴일','2027-03-01':'삼일절','2027-05-01':'노동절','2027-05-03':'대체공휴일','2027-05-05':'어린이날','2027-05-13':'부처님오신날','2027-06-06':'현충일','2027-07-17':'제헌절','2027-07-19':'대체공휴일','2027-08-15':'광복절','2027-08-16':'대체공휴일','2027-09-14':'추석 연휴','2027-09-15':'추석','2027-09-16':'추석 연휴','2027-10-03':'개천절','2027-10-04':'대체공휴일','2027-10-09':'한글날','2027-10-11':'대체공휴일','2027-12-25':'성탄절','2027-12-27':'대체공휴일'};
const MON3 = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const MONFULL = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const DOW = ['월','화','수','목','금','토','일'];
const LS = 'planner2027:';
const app = document.getElementById('app');

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseIso = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const mondayOf = d => addDays(d, -((d.getDay()+6)%7));
const md = d => `${d.getMonth()+1}/${d.getDate()}`;

// 주차 규칙: 월요일 시작, 그 주의 목요일이 속한 달의 주차로 계산 (달마다 4~5주)
function weeksOfMonth(m){
  const out = []; let mon = mondayOf(new Date(YEAR, m-1, 1));
  const last = new Date(YEAR, m, 0);
  while (mon <= last){
    const thu = addDays(mon,3);
    if (thu.getFullYear()===YEAR && thu.getMonth()===m-1) out.push(mon);
    mon = addDays(mon,7);
  }
  return out;
}
const ALL_WEEKS = []; for (let m=1;m<=12;m++) ALL_WEEKS.push(...weeksOfMonth(m));
const FIRST_WEEK = iso(ALL_WEEKS[0]), LAST_WEEK = iso(ALL_WEEKS[ALL_WEEKS.length-1]);
function weekInfo(monIso){
  const mon = parseIso(monIso), thu = addDays(mon,3), m = thu.getMonth()+1;
  const idx = weeksOfMonth(m).findIndex(w => iso(w)===monIso) + 1;
  const n = ALL_WEEKS.findIndex(w => iso(w)===monIso) + 1;
  return {mon, sun:addDays(mon,6), month:m, idx, n};
}
function todayTargets(){
  const t = new Date();
  if (t.getFullYear() < YEAR) return {month:1, week:FIRST_WEEK, day:`${YEAR}-01-01`, pre:true};
  if (t.getFullYear() > YEAR) return {month:12, week:LAST_WEEK, day:`${YEAR}-12-31`, post:true};
  let w = iso(mondayOf(t));
  if (w < FIRST_WEEK) w = FIRST_WEEK; if (w > LAST_WEEK) w = LAST_WEEK;
  return {month:t.getMonth()+1, week:w, day:iso(t)};
}

/* ---------- store: 이 기기(localStorage) + 클라우드(db, 사용자별 비공개) ---------- */
const cache = {}, remoteState = {}, writing = {}, again = {}, timers = {};
let db = null, me = null, mode = 'connecting', viewKeys = new Set();
function defaults(key){
  if (key==='year') return {goals:[]};
  if (key[0]==='m') return {days:{}, goals:[], todos:[], weekMemos:{}};
  if (key==='settings') return {goalCats:JSON.parse(JSON.stringify(DEFAULT_GCATS)), expCats:['외식','간식','장보기','교통','병원비','쇼핑','생활용품','문화','경조사','기타'], payMethods:['현금','계좌이체','체크카드','신용카드']};
  if (key[0]==='d') return {sleep:{bed:'',wake:''}, meals:{b:'',l:'',d:'',s:''}, cond:{score:0,note:''}, contents:[], screen:{h:'',m:''}};
  return {routines:[], kpt:{keep:'',problem:'',try:'',etc:''}};
}
function get(key){
  viewKeys.add(key);
  if (!cache[key]){
    let v = null; try { v = JSON.parse(localStorage.getItem(LS+key)); } catch(e){}
    cache[key] = Object.assign(defaults(key), v || {});
    if (db) fetchRemote(key);
  }
  return cache[key];
}
function save(key){
  try { localStorage.setItem(LS+key, JSON.stringify(cache[key])); } catch(e){}
  if (remoteState[key] !== 'done') remoteState[key + ':edited'] = true;
  if (!db) return;
  clearTimeout(timers[key]); setSync('busy');
  timers[key] = setTimeout(() => writeRemote(key), 700);
}
const ref = key => db.collection('data/users/' + me).doc(key);
async function fetchRemote(key){
  if (remoteState[key]) return; remoteState[key] = 'loading';
  try {
    const snap = await ref(key).get();
    remoteState[key] = 'done';
    if (snap.exists && !remoteState[key + ':edited']){
      cache[key] = Object.assign(defaults(key), JSON.parse(JSON.stringify(snap.data())));
      try { localStorage.setItem(LS+key, JSON.stringify(cache[key])); } catch(e){}
      if (viewKeys.has(key)) safeRender();
    } else if (JSON.stringify(cache[key]) !== JSON.stringify(defaults(key))) {
      writeRemote(key);
    }
  } catch(e){ remoteState[key] = 'done'; }
}
async function writeRemote(key, retried){
  if (writing[key]){ again[key] = true; return; }
  writing[key] = true;
  try { await ref(key).set(JSON.parse(JSON.stringify(cache[key]))); setSync('ok'); }
  catch(e){
    if (e && e.code==='unavailable' && !retried){ writing[key]=false; setTimeout(()=>writeRemote(key,true), 800+Math.random()*800); return; }
    setSync('err');
  }
  writing[key] = false;
  if (again[key]){ again[key] = false; writeRemote(key); }
}
function setSync(s){
  mode = s;
  const el = document.getElementById('sync');
  const txt = {connecting:'연결 중…', ok:'저장됨', busy:'저장 중…', err:'클라우드 저장 실패 · 이 기기에 보관', local:'이 기기에 저장됨'}[s];
  el.className = 'sync ' + ({ok:'ok',busy:'busy',err:'err'}[s]||'');
  el.querySelector('span').textContent = txt; el.title = txt;
}
async function connect(){
  const timeout = setTimeout(()=>{ if(!db) setSync('local'); }, 10000);
  try {
    if (!window.claude || !window.claude.use){ clearTimeout(timeout); setSync('local'); return; }
    const [d, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!d || !u){ clearTimeout(timeout); setSync('local'); return; }
    const id = await u.id();
    clearTimeout(timeout);
    if (!id){ setSync('local'); return; }
    db = d; me = id; setSync('ok');
    Object.keys(cache).forEach(fetchRemote);
  } catch(e){ clearTimeout(timeout); setSync('local'); }
}
let pendingRender = false;
function safeRender(){
  const a = document.activeElement;
  if (a && app.contains(a) && (a.tagName==='TEXTAREA' || a.isContentEditable || (a.tagName==='INPUT' && a.type==='text'))){
    if (!pendingRender){ pendingRender = true; a.addEventListener('blur', ()=>{ pendingRender=false; render(); }, {once:true}); }
  } else render();
}

/* ---------- views ---------- */
let yearFilter = '전체';
const openAcc = new Set();
function catTag(c){ const bg = PAL[catInfo(c).c % PAL.length].bg; return bg ? `<span class="tag" style="background:${bg};color:#1a1a1a">${esc(catLabel(c))}</span>` : `<span class="tag">${esc(catLabel(c))}</span>`; }

function viewHome(){
  const t = todayTargets(), wi = weekInfo(t.week), now = new Date();
  return `
  <div class="hero">
    <div class="big">2027</div>
    <div class="today">오늘 ${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} (${DOW[(now.getDay()+6)%7]})</div>
  </div>
  <div class="shortcuts">
    <a class="sc" href="#year"><div class="eyebrow">Yearly</div><div class="t">2027</div><div class="go">→</div></a>
    <a class="sc" href="#month-${t.month}"><div class="eyebrow">Monthly</div><div class="t">${MON3[t.month-1]}</div><div class="go">→</div></a>
    <a class="sc" href="#week-${t.week}"><div class="eyebrow">Weekly</div><div class="t">W${pad(wi.n)}</div><div class="go">→</div></a>
    <a class="sc" href="#day-${t.day}"><div class="eyebrow">Daily</div><div class="t">${+t.day.slice(5,7)}/${+t.day.slice(8)}</div><div class="go">→</div></a>
  </div>`;
}

function monthGridHTML(){
  const y = get('year');
  return MON3.map((m,i)=>{
    const gs = y.goals.filter(g=>g.months[i]);
    return `<a class="mbox" href="#month-${i+1}" aria-label="${i+1}월 Monthly로 이동"><h4><b>${m}</b><span>${gs.length ? `${gs.filter(g=>g.dm&&g.dm[i]).length}/${gs.length}` : '0개'}</span></h4>
      ${gs.length ? `<ul>${gs.map(g=>`<li class="${g.dm&&g.dm[i]?'done':''}"><span class="dot" style="background:${catDot(g.cat)}"></span><span>${esc(g.text)}</span></li>`).join('')}</ul>` : NOGOAL}<span class="mgo" aria-hidden="true">→</span></a>`;
  }).join('');
}
function viewYear(){
  const y = get('year');
  const vis = y.goals.filter(g => yearFilter==='전체' || g.cat===yearFilter);
  const CATS = gcats().map(x=>x.n);
  if (yearFilter!=='전체' && !CATS.includes(yearFilter)) yearFilter = '전체';
  const defCat = yearFilter==='전체' ? CATS[0] : yearFilter;
  return `
  <div class="phead"><div class="ttl"><h1>2027</h1></div></div>
  <section class="card">
    <form class="goal-form" data-form="goal">
      <select class="field" id="goalCat">${CATS.map(c=>`<option value="${esc(c)}"${c===defCat?' selected':''}>${esc(catLabel(c))}</option>`).join('')}</select>
      <input class="field" type="text" id="goalText" autocomplete="off">
      <button class="btn">추가</button>
    </form>
    <div class="chips">${['전체',...CATS].map(c=>`<button class="chip${c===yearFilter?' on':''}" data-act="filter" data-v="${esc(c)}">${c==='전체'?c:esc(catLabel(c))}${c==='전체'?` ${y.goals.length}`:` ${y.goals.filter(g=>g.cat===c).length}`}</button>`).join('')}<button type="button" class="gear ${gEdit?'on':''}" data-act="gedit" aria-label="카테고리 편집">${GEAR}</button></div>
    ${gEdit ? `<div class="emgr gmgr"><div class="mchips">${gcats().map((x,i)=> isRen('goalCats',i) ? renInput('goalCats',i,(x.e||'')+x.n) : `<span class="mchip"><button type="button" class="cdot" style="background:${PAL[x.c%PAL.length].dot}" data-act="gcolor" data-i="${i}" aria-label="색 바꾸기"></button><button type="button" class="mname" data-act="ren" data-kind="goalCats" data-i="${i}">${esc((x.e||'')+x.n)}</button><button type="button" class="x" data-act="gdel" data-i="${i}" aria-label="${esc(x.n)} 삭제">×</button></span>`).join('')}
      <form class="optadd" data-form="gcat"><input class="ln" type="text" aria-label="카테고리 추가" autocomplete="off"><button class="addbtn sm" aria-label="추가">+</button></form></div></div>` : ''}
    ${vis.length ? `<div class="gt-wrap"><table class="gt">
      <thead><tr><th></th><th class="l">카테고리</th><th class="l">목표</th><th>전체</th>${MON3.map((m,i)=>`<th>${i+1}월</th>`).join('')}<th class="gr">달성률</th><th></th></tr></thead>
      <tbody id="goalBody">${vis.map(g=>`<tr data-id="${g.id}">
        <td class="handle">⋮⋮</td>
        <td class="l" style="width:118px">${catTag(g.cat)}</td>
        <td class="l"><input class="bare" type="text" value="${esc(g.text)}" data-goal-text="${g.id}"></td>

  if (h==='monthly') return {view:'month', m:t.month};
  if (h==='weekly') return {view:'week', k:t.week};
  if (h==='daily') return {view:'day', d:t.day};
  if ((m = h.match(/^day-(\d{4}-\d{2}-\d{2})$/))){ let d = m[1]; if (d<FIRST_DAY) d=FIRST_DAY; if (d>LAST_DAY) d=LAST_DAY; d = iso(parseIso(d)); return {view:'day', d}; }

/* ---------- drag reorder (마우스·터치 모두) ---------- */
function bindDrag(){
  const body = document.getElementById('goalBody'); if (!body) return;
  body.addEventListener('pointerdown', e=>{
    const h = e.target.closest('.handle'); if (!h) return;
    e.preventDefault();
    const row = h.closest('tr'); row.classList.add('dragging');
    const move = ev=>{
      const rows = [...body.querySelectorAll('tr:not(.dragging)')]; let before = null;
      for (const r of rows){ const b = r.getBoundingClientRect(); if (ev.clientY < b.top + b.height/2){ before = r; break; } }
      if (before) { if (row.nextSibling!==before) body.insertBefore(row, before); } else if (body.lastElementChild!==row) body.appendChild(row);
    };
    const up = ()=>{
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
      row.classList.remove('dragging');
      const order = [...body.querySelectorAll('tr')].map(r=>r.dataset.id);
      const y = get('year'), set = new Set(order);
      const slots = y.goals.map((g,i)=>set.has(g.id)?i:-1).filter(i=>i>=0);
      const byId = Object.fromEntries(y.goals.map(g=>[g.id,g]));
      const ng = y.goals.slice(); slots.forEach((s,j)=>{ ng[s] = byId[order[j]]; });
      if (ng.some((g,i)=>g!==y.goals[i])){ y.goals = ng; save('year'); document.getElementById('monthGrid').innerHTML = monthGridHTML(); }
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  });
}

  } else if (type==='wgoal'){
    const inp = f.querySelector('input'), text = inp.value.trim(); if (!text) return;
    const wk = f.dataset.k, w = get('w'+wk); w.goals = w.goals || []; w.goals.push({id:uid(), text, done:false});
    save('w'+wk); render(); const nf = app.querySelector(`form[data-form="wgoal"][data-k="${wk}"] input`); nf && nf.focus();
  } else if (type==='exp'){
    const amt = parseInt((document.getElementById('eAmt').value||'').replace(/[^0-9]/g,''),10);
    if (!(amt>0)){ document.getElementById('eAmt').focus(); return; }
    eCat = document.getElementById('eCat').value; ePay = document.getElementById('ePay').value;
    const dd = dayDoc(cur.d); dd.exps = dd.exps || [];
    dd.exps.push({id:uid(), kind:eKind, cat:eCat, pay:ePay, text:document.getElementById('eText').value.trim(), amt});
    save('d'+cur.d); render(); document.getElementById('eText').focus();
  } else if (type==='opt'){
    const inp = f.querySelector('input'), v = inp.value.trim(); if (!v) return;
    const st = get('settings'), list = st[f.dataset.kind]; if (!list.includes(v)) list.push(v);
    if (f.dataset.kind==='expCats') eCat = v; else ePay = v;
    save('settings'); render(); app.querySelector(`form[data-form="opt"][data-kind="${f.dataset.kind}"] input`).focus();
  } else if (type==='gcat'){
    let v = f.querySelector('input').value.trim(); if (!v) return;
    const list = gcats(); if (!list.some(x=>x.n===v)){ const used = list.map(x=>x.c); let c = PAL.findIndex((_,i)=>i!==4 && !used.includes(i)); if (c<0) c = list.length % PAL.length; list.push({n:v, e:'', c}); }
    save('settings'); render(); app.querySelector('form[data-form="gcat"] input').focus();
  } else if (type==='content'){
    const title = document.getElementById('cTitle').value.trim(); if (!title){ document.getElementById('cTitle').focus(); return; }
    cType = document.getElementById('cType').value;
    const key = 'd'+cur.d; dayDoc(cur.d).contents.push({id:uid(), type:cType, title, note:document.getElementById('cNote').value.trim()});
    save(key); render(); document.getElementById('cTitle').focus();
  } else if (type==='routine'){
    const text = document.getElementById('rText').value.trim(); if (!text) return;
    let n = parseInt(document.getElementById('rNum').value,10); if (!(n>=1)) n = 1; if (n>7) n = 7;
    const key = 'w'+cur.k; get(key).routines.push({id:uid(), text, n, checks:Array(n).fill(false)});
    save(key); render(); document.getElementById('rText').focus();
  }
});

app.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (UNDO_KEYS[act]){
    const keys = UNDO_KEYS[act](b), snap = keys.map(k=>[k, JSON.stringify(get(k))]);
    const row = b.closest('li,tr,.eline,.cline,.mchip');
    let label = '';
    if (row){ const inp = row.querySelector('input[type=text]'); const el = row.querySelector('.rt,.yg,.ctitle,.mname');
      if (row.classList.contains('eline')) label = [row.querySelector('.ecat'), row.querySelector('.eamt')].filter(Boolean).map(x=>x.textContent).join(' ');
      else label = (inp && inp.value) || (el && el.textContent) || ''; }
    label = label.trim(); if (label.length > 18) label = label.slice(0,18) + '…';
    queueMicrotask(()=>showUndo(label, snap));
  }
  if (act==='cond'){ const d=dayDoc(cur.d), v=+b.dataset.v; d.cond.score = d.cond.score===v ? 0 : v; save('d'+cur.d); render(); return; }
  if (act==='ren'){ renaming = {kind:b.dataset.kind, i:+b.dataset.i}; render(); const inp = app.querySelector('input.ren'); if (inp){ inp.focus(); inp.select(); } return; }
  if (act==='gedit'){ gEdit = !gEdit; render(); return; }
  if (act==='gdel'){ gcats().splice(+b.dataset.i,1); save('settings'); render(); return; }
  if (act==='gcolor'){ const x = gcats()[+b.dataset.i]; x.c = (x.c+1) % PAL.length; save('settings'); render(); return; }
  if (act==='ekind'){ eKind = b.dataset.v; app.querySelectorAll('.kseg button').forEach(x=>x.classList.toggle('on', x.dataset.v===eKind)); return; }
  if (act==='eedit'){ eEdit = !eEdit; render(); return; }
  if (act==='delOpt'){ const st=get('settings'), list=st[b.dataset.kind]; list.splice(+b.dataset.i,1); save('settings'); render(); return; }
  if (act==='delExp'){ const d=dayDoc(cur.d); d.exps = (d.exps||[]).filter(e=>e.id!==id); save('d'+cur.d); render(); return; }
  if (act==='delContent'){ const d=dayDoc(cur.d); d.contents = d.contents.filter(c=>c.id!==id); save('d'+cur.d); render(); return; }
  if (act==='filter'){ yearFilter = b.dataset.v; render(); return; }
  if (act==='delGoal'){ const y=get('year'); y.goals = y.goals.filter(g=>g.id!==id); save('year'); render(); return; }
  if (act==='unYear'){ const g=get('year').goals.find(x=>x.id===id); if(g){ const mi=+(b.dataset.m||cur.m)-1; g.months[mi]=false; if(g.dm) g.dm[mi]=false; save('year'); } render(); return; }
  if (act==='delWGoal'){ const w=get('w'+b.dataset.k); w.goals=(w.goals||[]).filter(x=>x.id!==id); save('w'+b.dataset.k); render(); return; }
  if (act==='gptoggle'){ setGP(!gpOpen); return; }
  if (act==='gpick'){ const w = b.closest('.gpickw'); const open = !w.classList.contains('open'); app.querySelectorAll('.gpickw.open').forEach(x=>x.classList.remove('open')); w.classList.toggle('open', open); return; }
  if (act==='gchoose'){ const w = b.closest('.gpickw'), v = b.dataset.v, gv = w.querySelector('.gval'), btn = w.querySelector('.gpick');
    if (gv.value === v){ gv.value = ''; btn.innerHTML = '<span class="gdot empty"></span>'; }
    else { gv.value = v; const c = gcats().find(x=>x.n===v); btn.innerHTML = c && c.e ? `<span class="gemo">${c.e}</span>` : `<span class="gdot" style="background:${catDot(v)}"></span>`; btn.title = v; }
    w.classList.remove('open'); const inp = w.closest('form').querySelector('input.field'); inp && inp.focus(); return; }
  if (act==='dwOpen'){ drawer = {m:+b.dataset.m}; drawerAnim = true; render(); setTimeout(()=>{ const sec = document.getElementById(b.dataset.focus==='todos'?'dw-todos':'dw-goals'); if (sec){ sec.scrollIntoView({block:'start'}); const i = sec.querySelector('form input') || sec.querySelector('.rte'); i && i.focus({preventScroll:true}); } }, 260); return; }
  if (act==='dwClose'){ const d=app.querySelector('.drawer'), o=app.querySelector('.dw-ov'); d&&d.classList.remove('open'); o&&o.classList.remove('open'); setTimeout(()=>{ drawer=null; render(); }, 220); return; }
  if (act==='delMGoal' || act==='delTodo'){ const key='m'+pad(+(b.dataset.m||cur.m)), d=get(key); const f = act==='delMGoal'?'goals':'todos'; d[f] = d[f].filter(x=>x.id!==id); save(key); render(); return; }
  if (act==='delRoutine'){ const key='w'+cur.k, w=get(key); w.routines = w.routines.filter(r=>r.id!==id); save(key); render(); return; }
  if (act==='copyRoutines'){ const src=get('w'+b.dataset.from), key='w'+cur.k; get(key).routines = src.routines.map(r=>({id:uid(), text:r.text, n:r.n, checks:Array(r.n).fill(false)})); save(key); render(); return; }
});

app.addEventListener('change', e=>{
  const el = e.target, ds = el.dataset;
  if (ds.dset && el.type==='time'){ render(); return; }
  if (ds.drt){
    const dd = dayDoc(cur.d); dd.rt = dd.rt || {};
    const wk = iso(mondayOf(parseIso(cur.d))), wkey = 'w'+wk, r = get(wkey).routines.find(x=>x.id===ds.drt); if (!r) return;
    if (el.checked){ const i = r.checks.indexOf(false); if (i<0){ render(); return; } r.checks[i] = true; dd.rt[r.id] = true; }
    else { const i = r.checks.lastIndexOf(true); if (i>=0) r.checks[i] = false; delete dd.rt[r.id]; }
    save(wkey); save('d'+cur.d); render(); return;
  }
  if (ds.goalAll){ const g = get('year').goals.find(x=>x.id===ds.goalAll); if(!g) return; g.months = Array(12).fill(el.checked); save('year'); render(); }
  else if (ds.goalMonth){ const g = get('year').goals.find(x=>x.id===ds.goalMonth); if(!g) return; g.months[+ds.i] = el.checked; save('year'); render(); }
  else if (ds.goalText){ document.getElementById('monthGrid').innerHTML = monthGridHTML(); }
  else if (ds.gdone){ const g=get('year').goals.find(x=>x.id===ds.gdone); if(!g) return; g.done=el.checked; save('year'); render(); }
  else if (ds.ygdone){ const g=get('year').goals.find(x=>x.id===ds.ygdone); if(!g) return; g.dm = g.dm || Array(12).fill(false); g.dm[+ds.m-1]=el.checked; save('year'); render(); }
  else if (ds.mgdone){ const key='m'+pad(+ds.m), g=get(key).goals.find(x=>x.id===ds.mgdone); if(!g) return; g.done=el.checked; save(key); render(); }
  else if (ds.wgdone){ const w=get('w'+ds.k), g=(w.goals||[]).find(x=>x.id===ds.wgdone); if(!g) return; g.done=el.checked; save('w'+ds.k); render(); }
  else if (ds.todo){ const key='m'+pad(+(ds.m||cur.m)), x=get(key).todos.find(t=>t.id===ds.todo); if(!x) return; x.done = el.checked; save(key); render(); }
  else if (ds.rt){ const key='w'+cur.k, r=get(key).routines.find(t=>t.id===ds.rt); if(!r) return; r.checks[+ds.i] = el.checked; save(key); render(); }
});

app.addEventListener('input', e=>{
  const el = e.target, ds = el.dataset;
  if (el.id==='eAmt'){ const n=el.value.replace(/[^0-9]/g,''); el.value = n ? (+n).toLocaleString('ko-KR') : ''; return; }
  if (el.id==='eCat'){ eCat = el.value; return; }
  if (el.id==='ePay'){ ePay = el.value; return; }
  if (ds.dset){ let v = el.value; if (el.type==='number'){ v = v.replace(/[^0-9]/g,''); const mx = +el.max; if (v!=='' && +v>mx) v = String(mx); if (el.value!==v) el.value = v; } setPath(dayDoc(cur.d), ds.dset, v); save('d'+cur.d); return; }
  if (el.classList && el.classList.contains('rte')){ if (e.isComposing) saveMemo(el); else rteInput(el); return; }
  if (ds.day){ const key='m'+pad(cur.m); const d=get(key); if (el.value) d.days[ds.day]=el.value; else delete d.days[ds.day]; save(key); }
  else if (ds.mkpt){ const key='m'+pad(cur.m), doc=get(key); doc.kpt = doc.kpt || {}; doc.kpt[ds.mkpt] = el.value; save(key); const ap=el.closest('details').querySelector('.ap'); if(ap) ap.textContent = el.value.split('\n')[0]; }
  else if (ds.kpt){ const key='w'+cur.k; get(key).kpt[ds.kpt] = el.value; save(key); const ap=el.closest('details').querySelector('.ap'); if(ap) ap.textContent = el.value.split('\n')[0]; }
  else if (ds.goalText){ const g=get('year').goals.find(x=>x.id===ds.goalText); if(g){ g.text=el.value; save('year'); } }
  else if (ds.wgoalText){ const w=get('w'+ds.k), g=(w.goals||[]).find(x=>x.id===ds.wgoalText); if(g){ g.text=el.value; save('w'+ds.k); } }
  else if (ds.mgoal){ const key='m'+pad(+(ds.m||cur.m)), g=get(key).goals.find(x=>x.id===ds.mgoal); if(g){ g.text=el.value; save(key); } }
  else if (ds.todoText){ const key='m'+pad(+(ds.m||cur.m)), x=get(key).todos.find(t=>t.id===ds.todoText); if(x){ x.text=el.value; save(key); } }
});

app.addEventListener('toggle', e=>{ const d=e.target; if(!d.dataset || !d.dataset.acc) return; if(d.open){ openAcc.add(d.dataset.acc); const t=d.querySelector('textarea'); t && t.focus(); } else openAcc.delete(d.dataset.acc); }, true);

render();
setSync('connecting');
connect();
})();
</script>
